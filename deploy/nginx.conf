# 放到 /etc/nginx/sites-available/ai-pr，再软链到 sites-enabled/
# 前端静态文件由 nginx 直接吐，/api 反代给本机的 Spring Boot
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ai-pr;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # vite 构建出的资源带内容 hash，文件名变了内容才会变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口文件不能缓存：不然发新版本后浏览器还在用旧的 index.html，
    # 引用的 assets 文件名对不上，页面直接白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲：nginx 默认会把响应攒在缓冲区里，
        # 攒着不发给浏览器，进度就是"卡住不动"，直到任务结束才一次性刷出来
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # 一次评审要 60~90 秒，默认 60 秒会在这里被掐断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 前端是 vue-router 的 history 模式，/tasks/xxx 这类路径磁盘上没有对应文件，
    # 必须回退到 index.html 交给前端路由，否则直接访问或刷新就是 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
