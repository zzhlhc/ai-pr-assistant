server:
  port: 8080

spring:
  application:
    name: ai-pr-assistant

  # 激活 local profile，Spring Boot 会额外加载 application-local.yml
  # 该文件存放密钥，已被 .gitignore 忽略。部署时用环境变量覆盖：SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mvc:
    async:
      # SSE 长连接的超时时间。Tomcat 默认 30 秒，而一次评审要 60~90 秒，
      # 不改这里，连接会在任务跑完之前被容器掐断，前端永远等不到结果。
      request-timeout: 10m

  datasource:
    # 账号密码放 application-local.yml（已被 gitignore），部署时用环境变量覆盖
    url: jdbc:mysql://localhost:3306/ai_pr_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      # 数据库没起来时快速失败，而不是让请求挂 30 秒
      connection-timeout: 3000

  sql:
    init:
      # 默认是 embedded，只对 H2 这类内嵌库生效，MySQL 必须显式打开。
      # schema.sql 全部写成 IF NOT EXISTS，所以每次启动重复执行也安全。
      mode: always

  ai:
    openai:
      # 连接级超时。⚠️ Spring AI 2.0.1 里请求级的 options.timeout 默认写死 60s，
      # 会盖过这里的配置，真正生效的是代码里的 AgentChatClient.READ_TIMEOUT。
      # 这里的值留着当兜底。
      timeout: 300s
      # 三个环境变量不设置也能启动，但调用模型会失败。
      # 推荐本地用 application-local.yml 覆盖，该文件已在 .gitignore 中忽略。
      api-key: ${LLM_API_KEY:sk-placeholder}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          # 代码评审要的是稳定和准确，不是发散
          temperature: 0.2
        # ⚠️ 这个值只绑定到 OpenAiChatProperties，Spring AI 2.0.1 的 toOptions() 没有把它
        # 写进 OpenAiChatOptions，所以对请求超时不起作用，仅用于启动日志自检。
        timeout: 300s

gitee:
  token: ${GITEE_TOKEN:}
  base-url: https://gitee.com/api/v5

review:
  # 模型计费单价（元 / 百万 token）。⚠️ 下面只是示例值，务必按你自己账号的账单改，
  # 改完启动日志里的"预估费用"才是准的。
  pricing:
    input-price-per-million: 2.0        # 输入，缓存未命中
    cached-input-price-per-million: 0.04 # 输入，命中上下文缓存
    output-price-per-million: 8.0       # 输出

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.zhouziheng: debug
